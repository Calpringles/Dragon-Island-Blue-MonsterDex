<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon Island Blue - MonsterDex</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar: Search and List -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>MonsterDex</h1>
                <input type="text" id="search-input" placeholder="Search monsters...">
                
                <div class="filter-group" style="display:flex; flex-direction:column; gap:8px;">
                    <select id="element-filter">
                        <option value="All">All Elements</option>
                        <option value="Fire">Fire</option>
                        <option value="Water">Water</option>
                        <option value="Earth">Earth</option>
                        <option value="Air">Air</option>
                    </select>
                    <div style="display:flex; gap:8px;">
                        <select id="sort-filter" style="flex:1; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: rgba(15, 23, 42, 0.6); color: var(--text-primary); font-size: 14px; cursor: pointer;">
                            <option value="index">Index (Default)</option>
                            <option value="name">Name</option>
                            <option value="element">Element</option>
                            <option value="stars">Star Rating</option>
                            <option value="stats">Base Stats Total</option>
                        </select>
                        <button id="sort-dir-btn" style="padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: rgba(15, 23, 42, 0.6); color: var(--text-primary); cursor: pointer; transition: background 0.2s;">⬆️</button>
                    </div>
                </div>
            </div>
            
            <div class="monster-list" id="monster-list">
                <!-- Monsters populated by JS -->
            </div>
        </aside>

        <!-- Main Content: Detail View -->
        <main class="main-content">
            <div id="monster-detail" class="monster-detail empty-state">
                <div class="empty-message">
                    <h2>Select a monster to view details</h2>
                </div>
            </div>
        </main>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
